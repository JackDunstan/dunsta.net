    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 3rem 2.5rem;
        }
        
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }
        
        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.02em;
        }
        
        .linkedin-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            background: #0a66c2;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.15s ease;
        }
        
        .linkedin-link:hover {
            background: #004182;
        }
        
        .linkedin-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <main class="card">
        <img class="avatar" src="assets/images/jack-2026.jpg" alt="Jack Dunstan">
        <h1>Jack Dunstan</h1>
        <a class="linkedin-link" href="https://www.linkedin.com/in/jackdunstan/">
